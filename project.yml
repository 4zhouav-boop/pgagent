name: PGAgent
options:
  bundleIdPrefix: run.pgagent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  PGAgent:
    type: application
    platform: iOS
    sources:
      - path: PGAgent
        excludes:
          # ⛔ bridging header 只能被 `SWIFT_OBJC_BRIDGING_HEADER` 引用，
          #    ⛔ 不能被当成源文件参与编译（否则报 "duplicate interface" / 链接错误）
          - "PGAgent-Bridging-Header.h"
      # ⭐⭐⭐ §3130 **kgx 模型（YOLOv11n，ncnn 格式）打进 App bundle**
      #   PC 从 `ks_mobile/tools/leishen/project/mxwj/` 读；手机端改为 bundle 资源
      #   ⇒ `Bundle.main.path(forResource:"kgx", ofType:"param")` 能取到（见 KGXNet.swift）
      - path: PGAgent/Models
        buildPhase: resources
    info:
      path: PGAgent/Info.plist
      properties:
        CFBundleDisplayName: PGAgent
        # ⭐ 版本号**唯一来源**（界面标题从 Info.plist 读，见 AppVersion）
        #    发版时只改这里 ⇒ 界面/接口/包 三处自动一致（§2239 的教训）
        CFBundleShortVersionString: "0.78"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # ⭐ 关键 1：让 App 的 Documents 暴露给「文件」App
        #   ⇒ 快捷指令「存储到文件」才能把截图写进来（这是「眼」的命门）
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # ⭐ 关键 2：蓝牙权限（连 ESP32 发 HID）—— 前台用蓝牙**不需要 entitlement**，免费账号可用
        NSBluetoothAlwaysUsageDescription: "连接 ESP32 外设以发送点击指令"
        NSBluetoothPeripheralUsageDescription: "连接 ESP32 外设以发送点击指令"
        # ⛔⛔ §1798 **删掉 UIBackgroundModes: bluetooth-central**
        #   ⛔ 实测（真机）：声明了它 ⇒ iOS **拒绝启动**，错误
        #      `BSErrorCodeDescription: Security` / `RequestDenied`
        #   📏 根因：`bluetooth-central` 需要 entitlement `com.apple.developer.bluetooth-central`，
        #      而**免费 Apple ID 的描述文件里没有这一项**（只有 4 项：
        #      application-identifier / team-identifier / get-task-allow / keychain-access-groups）。
        #   ⭐ 而且**去掉它不影响最终架构** —— `_note_1792` 的结论本来就是
        #      「活」要靠**「事件驱动回合」**而不是"长期后台"，
        #      所以先拿掉后台模式，把 App 跑起来验证 V0 生死线（快捷指令截屏 → Documents）。
        # UIBackgroundModes:
        #   - bluetooth-central
        # ⭐ 关键 4：允许调快捷指令的 URL scheme
        #
        # ⭐⭐⭐ §2272 **补上快手的 scheme**（这是「点开始跑后录到自己」的解法）
        #
        # ## 为什么必须在这里声明
        # `UIApplication.canOpenURL()` 对**未声明**的 scheme 一律返回 false
        # ⇒ 实测：`kwai://` / `kuaishou://` / `ksnebula://` 全部 `ok:false`。
        # ⚠️ 而 `open()` **不受**这个列表限制 ⇒ 它**能**把系统弹窗调起来
        #   （实测弹出了「"PGAgent"想要打开"快手"」）——
        #   所以两者的差别是：**`canOpenURL` 用来"探测"，必须声明**。
        #
        # ## 为什么需要"从 App 打开快手"
        # 手机端录屏录的是**当前前台**（不像 PC 抓投屏窗口）⇒
        #   点「开始跑」时 App 在前台 ⇒ **录到的是 PGAgent 自己** ⇒ 判 `unknown`
        #   （真机并排对照 `_var/_d1_side.png` 铁证：两边都是控制台界面）。
        # ⇒ 必须**自动切到快手**，否则一轮都跑不了。
        #
        # ⚠️ 切 App 时 iOS 会弹「想要打开」确认框，**必须点「打开」**；
        #   而 BLE(HID) 点击**对系统弹窗有效**（§2272 实测：连点 5 次把排队弹窗全清掉）。
        #   ⇒ 流程 = `open(scheme)` → 弹窗 → **用 BLE 点「打开」**。
        LSApplicationQueriesSchemes:
          - shortcuts
          - kwai
          - kuaishou
          - ksnebula
          - snssdk1112
        # 本地网络（iOS 14+ 需要，虽然我们走 BLE 不走网络，先留着）
        NSLocalNetworkUsageDescription: "与本地设备通信；电脑端经局域网在线调试"
        # ⭐ v0.11.0 远程调试用 Bonjour 广播（不声明会被系统拒绝广播）
        NSBonjourServices:
          - _pgagent._tcp
        # ⭐⭐⭐ 「活」—— 后台音频（§2230 实测必须）
        #
        # 📏 为什么需要：`AVPictureInPictureController` 用
        #    `AVSampleBufferDisplayLayer` 当内容源时，语义上仍是「视频播放」；
        #    ⛔ 没有后台音频声明 + 没激活 AVAudioSession ⇒
        #       `isPictureInPicturePossible` **永远是 false** ⇒ PiP 起不来
        #       ⇒ App 一切后台就被挂起 ⇒ `/run` 闭环走不完。
        # ✅ 加上 `audio` 后，PiP 才能起来，App 才能在别人的 App 前面继续跑。
        #
        # ⚠️ 与 §1798 的 `bluetooth-central` **不同**：那条需要
        #    `com.apple.developer.bluetooth-central` entitlement（免费账号没有）；
        #    而 `audio` **不需要额外 entitlement** ⇒ 免费 Apple ID 可用。
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.pgagent.PGAgent
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        # ⭐⭐⭐ §3130 **ncnn 的 C 接口桥**（见 `PGAgent/PGAgent-Bridging-Header.h`）
        #   `ncnn.xcframework` 没有 modulemap ⇒ Swift 只能经 bridging header 拿到 `c_api.h`。
        #   ⛔ 不要改成 `import ncnn`：那个 framework 里没有 Swift module。
        SWIFT_OBJC_BRIDGING_HEADER: PGAgent/PGAgent-Bridging-Header.h
        # ⭐ §3176 官方 ncnn 的头文件在 ncnn.framework/Versions/A/Headers/ncnn/ 下
        #   ⇒ bridging header 里写 <ncnn/c_api.h> 就要求这个 Headers 目录进搜索路径。
        #   ⚠️ 依赖写法 "framework:" 只加 -F（framework 搜索路径），不加 -I ⇒ 必须显式写。
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/ncnn.framework/Headers
        # ⛔⛔⛔ §3134 **`ncnn.framework` 是「静态」C++ framework ⇒ 必须链 `libc++`**
        #
        # ## 真机血案（CI run 39139134310，2026-10-19 00:10）
        # ```
        # Undefined symbols for architecture arm64:
        #   "std::__1::basic_string<...>::compare(...) const", referenced from:
        #       ncnn::Net::find_blob_index_by_name(char const*) const in ncnn[arm64][18](net.cpp.o)
        #       ncnn::Einsum::load_param(...) in ncnn[arm64][164](einsum.cpp.o)
        #   "operator delete[](void*)", referenced from: ncnn::Interp::forward(...)
        #   _ncnn_mat_create_3d in ncnn[arm64][5](c_api.cpp.o)
        # ld: symbol(s) not found for architecture arm64
        # ```
        # 📏 **根因判定（⛔ 不是猜，看符号名就知道）**：
        #   报错里**清一色是 `std::__1::...` 和 `operator new/delete`** ⇒
        #   这是 **libc++（C++ 标准库）没链上**，⛔ 不是 ncnn 库缺符号。
        #   `_ncnn_*` 那几条是**连带现象**：`c_api.cpp.o` 里那些 C 函数体调用 ncnn 的 C++ 类
        #   （`ncnn::Net::create_extractor` 等），C++ 类又依赖 libc++ ⇒ 一层层全成 undefined。
        #   复核（同一轮实测）：`strings ncnn.framework/ncnn` 里
        #     `ncnn_net_create`/`ncnn_mat_create_3d`/`ncnn_extractor_create`/`ncnn_net_load_param`
        #     **全部存在**；文件头 `CA FE BA BE` = fat 静态库；`c_api.cpp.o`（32KB）也在其中
        #   ⇒ **库本身没问题，是 target 少了一个链接项**。
        # ✅ 正解 = `-lc++`（等价于 Xcode 的 "C++ Standard Library: libc++"）。
        #   ⚠️ Swift target 默认**不会**自动链 libc++（它只链 libswiftCore 之类）；
        #      一旦 bridging header 里 `#include` 了 C++ 头（`c_api.h` 是纯 C，但它声明的实现是 C++），
        #      就必须显式声明。
        #
        # ⛔⛔⛔ §3135 **还要链 OpenMP**（同一个血案的**第二层**）
        # 加了 `-lc++` 之后 `std::__1::*` 全部消失 ✅，但冒出**另一批** undefined：
        # ```
        # "___kmpc_for_static_fini", referenced from:
        #     _.omp_outlined. in ncnn[arm64][26](absval.cpp.o)
        #     _.omp_outlined. in ncnn[arm64][27](absval_arm.cpp.o)
        #     ... (batchnorm / conv / pooling … 几乎每个 .o)
        # ```
        # 📏 判定（看符号名就知道）：`___kmpc_*` = **LLVM OpenMP runtime** 的入口函数。
        #   ⇒ 这个 ncnn 构建**开了 OpenMP**（多线程卷积），所以必须一并链 `openmp.xcframework`
        #     （同一个 repo 提供，1.8MB 真机 slice）。
        #   ⛔ 不选"关掉 OpenMP 重新编 ncnn"——那要自己编 ncnn，成本远大于加一个链接项。
        #
        # ⚠️ **顺序**：静态库链接是**从左到右**解析的 ⇒ `openmp` 必须排在 `ncnn` **之后**
        #   （ncnn 引用 openmp 的符号）。⛔ 反过来会报同样的 undefined。
        OTHER_LDFLAGS:
          - $(inherited)
          - -lc++
          - -force_load
          - $(SRCROOT)/ncnn.framework/ncnn
          - -force_load
          - $(SRCROOT)/openmp.framework/openmp
    dependencies:
      - target: PGShot
      - sdk: ReplayKit.framework
      - sdk: CoreImage.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: JavaScriptCore.framework
      # ⭐⭐⭐ §3130 **ncnn（「找 ✕」的 YOLO 运行时）**
      #   来源 https://github.com/xiaoshanlin000/NcnnXCFramework（**MIT**）
      #   内含 Tencent/ncnn **20221128**，含真机(arm64/arm64e/armv7) + 模拟器两个 slice。
      #   ⛔ 只用 `ncnn.xcframework`：PC 的 `_x_detect` 只要 ncnn + numpy，
      #      不碰 OpenCV（letterbox 是自己算的，`cv2.resize` 用 `CGContext` 替）。

  # ⭐⭐⭐ 「眼」—— ReplayKit 广播扩展（荔枝/所有 RPA App 的真正做法）
  #   主 App 用 RPSystemBroadcastPickerView().triggerPicker() **程序化启动**它，
  #   它拿到**整块屏幕的连续帧**，每帧 POST 到主 App 的 http://127.0.0.1:8899/frame
  PGShot:
    type: app-extension
    platform: iOS
    sources:
      - path: PGShot
    info:
      path: PGShot/Info.plist
      properties:
        CFBundleDisplayName: PGShot
        CFBundleShortVersionString: "0.78"
        CFBundleVersion: "1"
        # ⭐ 扩展必须声明 NSExtension，否则 iOS 不认（xcodegen 会重写 Info.plist）
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        # ⛔⛔⛔ §2679 **扩展的 bundle id 必须是主 App 的 bundle id + 后缀**
        #
        # ## 血案（用户令，逐字）
        # > 「**软件也被你搞坏了 录屏完全失效了**」
        #
        # ## 根因
        # ```
        #   主 App :  run.pgagent.PGAgent.8W9ZSMW4UW     ← 带 8W9ZSMW4UW 后缀
        #   扩展   :  run.pgagent.PGAgent.PGShot         ← ⛔ 原来少了 8W9ZSMW4UW
        # ```
        # iOS **硬性要求**：扩展的 bundle id 必须**以主 App 的 bundle id 为前缀**。
        # ⇒ 前缀不匹配 ⇒ 描述文件（`8W9ZSMW4UW.run.pgagent.PGAgent.8W9ZSMW4UW`）
        #   **不覆盖这个扩展** ⇒ 签名时报
        #   `IXErrorDomain Code=8 … does not match required prefix of
        #    run.pgagent.PGAgent.8W9ZSMW4UW`
        # ⇒ 当时为了绕开这个报错，**把扩展整个剥掉**（做成 `-noplug` 包）⇒
        #   **录屏彻底失效**（`/rec/start` → 404、`frames=0`、App 变成瞎子）。
        #
        # ## ✅ 正解：把扩展 id 改成主 App id + `.PGShot`
        # ⇒ 前缀匹配 ⇒ 描述文件覆盖它 ⇒ 可以正常签名 ⇒ **扩展保住**。
        # ⚠️ 与 `PGAgent` 的 `PRODUCT_BUNDLE_IDENTIFIER`（第 85 行）必须保持这个关系。
        # ⛔⛔⛔ §2703 **更正 §2679：扩展 id ⛔ 不要预置 team 后缀**
        #   爱思签名的规则（REPORT_2701 解包实证）：把前缀 run.pgagent.PGAgent 替换成 run.pgagent.PGAgent.8W9ZSMW4UW，
        #   主 App 和扩展**都改**。预置了后缀 ⇒ 签完变成 …8W9ZSMW4UW.8W9ZSMW4UW.PGShot（两遍）。
        #   构建时写 run.pgagent.PGAgent.PGShot ⇒ 签完正好是 run.pgagent.PGAgent.8W9ZSMW4UW.PGShot
        #   （与 §2090 跑通的 v090-extprov 同形；BroadcastStarter.extensionBundleID 的注释也是这么记的）。
        PRODUCT_BUNDLE_IDENTIFIER: run.pgagent.PGAgent.PGShot
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
