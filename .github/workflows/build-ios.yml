name: Build unsigned IPA

# ⭐ 「不用 Mac 编 iOS App」的答案：
#    - runner 是 GitHub 的 macOS 机器（公共仓库免费）
#    - 三个 CODE_SIGN_* 开关 ⇒ 跳过签名，产出**未签名 IPA**
#    - 产物用 upload-artifact 传回，在 Windows 上下载
#
# ⛔ §1803 踩过的坑：第 7 步曾报
#     `cp: PGAgent.xcarchive/Products/Applications/PGAgent.app: No such file or directory`
#   根因：第 6 步 `| xcpretty || true` —— **xcpretty 没装**（brew 里没这一步），
#         管道整体返回非 0 被 `|| true` 吃掉，**真正的报错被吞了**。
#   ✅ 修法：① 不用 xcpretty（直接看 xcodebuild 输出）
#            ② 编完**先 ls 出 archive 的真实结构**，再按实际路径打包（不再硬编码）

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ⛔ 不再 `| xcpretty || true`（会吞掉真实错误）
      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PGAgent.xcodeproj \
            -scheme PGAgent \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/PGAgent.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      # ⭐ 关键：先看清 archive 的真实结构，再据此打包
      - name: Inspect archive layout
        run: |
          echo "=== xcarchive 顶层 ==="
          ls -la "$RUNNER_TEMP/PGAgent.xcarchive" || true
          echo "=== Products ==="
          find "$RUNNER_TEMP/PGAgent.xcarchive/Products" -maxdepth 3 | head -40 || true

      - name: Package into unsigned IPA
        run: |
          set -e
          ARCH="$RUNNER_TEMP/PGAgent.xcarchive"
          # ⭐ 按实际找到的 .app 打包（不再硬编码 Applications/PGAgent.app）
          APP="$(find "$ARCH/Products" -maxdepth 3 -name '*.app' -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "⛔ 在 $ARCH/Products 下找不到 .app"
            find "$ARCH" -maxdepth 4 | head -60
            exit 1
          fi
          echo "找到 app: $APP"
          cd "$RUNNER_TEMP"
          rm -rf Payload PGAgent-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          APPNAME="$(basename "$APP")"
          rm -rf "Payload/$APPNAME/_CodeSignature" || true
          rm -f  "Payload/$APPNAME/embedded.mobileprovision" || true
          zip -qry PGAgent-unsigned.ipa Payload
          echo "=== IPA 内容 ==="
          unzip -l PGAgent-unsigned.ipa | head -30
          ls -la PGAgent-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: pgagent-unsigned-ipa
          path: ${{ runner.temp }}/PGAgent-unsigned.ipa
          retention-days: 30
